name: Install Argo CD on GKE

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: install-argocd-gke
  cancel-in-progress: false

jobs:
  install:
    name: Install Argo CD on the existing cluster
    runs-on: ubuntu-latest
    environment: gke-bootstrap
    env:
      PROJECT_ID: abdulproject-510307
      CLUSTER_NAME: ecommerce-learning
      CLUSTER_LOCATION: asia-south1
      ARGOCD_NAMESPACE: argocd
      ARGOCD_CHART_VERSION: 10.11.7
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud and the GKE authentication plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get credentials for the existing GKE cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install or upgrade Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm upgrade --install argocd argo/argo-cd \
            --namespace "$ARGOCD_NAMESPACE" \
            --create-namespace \
            --version "$ARGOCD_CHART_VERSION" \
            --set server.service.type=ClusterIP \
            --wait \
            --timeout 10m

      - name: Report deployment status
        run: |
          kubectl get deployments,services,pods --namespace "$ARGOCD_NAMESPACE"
          {
            echo "### Argo CD installed"
            echo ""
            echo "- Cluster: \`${CLUSTER_NAME}\` (\`${CLUSTER_LOCATION}\`)"
            echo "- Namespace: \`${ARGOCD_NAMESPACE}\`"
            echo "- Argo CD server is internal-only (\`ClusterIP\`)."
            echo "- This workflow does not create Argo CD Applications or expose a public endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
