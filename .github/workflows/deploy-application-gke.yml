name: Build images and update GitOps manifests

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "api-gateway/**"
      - "services/order-service/**"
      - "services/product-service/**"
      - "helm/ecommerce-demo/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/deploy-application-gke.yml"
      - ".github/workflows/deploy-gke.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-application-gke
  cancel-in-progress: false

env:
  PROJECT_ID: abdulproject-510307
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/abdulproject-510307/ecommerce-repo

jobs:
  build-and-deploy:
    name: Test, publish images, and commit desired versions
    runs-on: ubuntu-latest
    environment: gke-deploy
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push application images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build --tag "${REGISTRY}/colorful-frontend:${IMAGE_TAG}" frontend
          docker push "${REGISTRY}/colorful-frontend:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/api-gateway:${IMAGE_TAG}" api-gateway
          docker push "${REGISTRY}/api-gateway:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/product-service:${IMAGE_TAG}" services/product-service
          docker push "${REGISTRY}/product-service:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/order-service:${IMAGE_TAG}" services/order-service
          docker push "${REGISTRY}/order-service:${IMAGE_TAG}"

      - name: Record published image digests in Git
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          declare -A images=(
            [frontend]=colorful-frontend
            [api-gateway]=api-gateway
            [product-service]=product-service
            [order-service]=order-service
          )

          for service in frontend api-gateway product-service order-service; do
            image_name="${images[$service]}"
            digest="$(gcloud artifacts docker images describe \
              "${REGISTRY}/${image_name}:${IMAGE_TAG}" \
              --project="$PROJECT_ID" \
              --format='value(image_summary.digest)')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve an immutable image digest for ${service}."
              exit 1
            fi

            printf 'services:\n  %s:\n    image: "%s/%s@%s"\n' \
              "$service" "$REGISTRY" "$image_name" "$digest" \
              > "environments/dev/${service}.yaml"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/frontend.yaml \
            environments/dev/api-gateway.yaml \
            environments/dev/product-service.yaml \
            environments/dev/order-service.yaml
          if git diff --cached --quiet; then
            echo "Image digests are already recorded."
            exit 0
          fi
          git commit -m "Update dev images to ${IMAGE_TAG}"
          git push origin "HEAD:main"

      - name: Report GitOps handoff
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          {
            echo "### Image build complete; Argo CD will sync Git"
            echo ""
            echo "- Source commit: \`${IMAGE_TAG}\`"
            echo "- Immutable image digests were committed under \`environments/dev/\`."
            echo "- Argo CD applies the desired state from the main branch."
          } >> "$GITHUB_STEP_SUMMARY"
