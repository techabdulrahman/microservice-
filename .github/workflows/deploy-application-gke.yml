name: Build and deploy application to GKE

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "api-gateway/**"
      - "services/order-service/**"
      - "services/product-service/**"
      - "helm/ecommerce-demo/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/deploy-application-gke.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-application-gke
  cancel-in-progress: false

env:
  PROJECT_ID: abdulproject-510307
  REGION: asia-south1
  CLUSTER_NAME: ecommerce-learning
  NAMESPACE: ecommerce
  REGISTRY: asia-south1-docker.pkg.dev/abdulproject-510307/ecommerce-repo

jobs:
  build-and-deploy:
    name: Test, publish images, and deploy Helm release
    runs-on: ubuntu-latest
    environment: gke-bootstrap
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud and the GKE authentication plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable application images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build --tag "${REGISTRY}/colorful-frontend:${IMAGE_TAG}" frontend
          docker push "${REGISTRY}/colorful-frontend:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/api-gateway:${IMAGE_TAG}" api-gateway
          docker push "${REGISTRY}/api-gateway:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/product-service:${IMAGE_TAG}" services/product-service
          docker push "${REGISTRY}/product-service:${IMAGE_TAG}"

          docker build --tag "${REGISTRY}/order-service:${IMAGE_TAG}" services/order-service
          docker push "${REGISTRY}/order-service:${IMAGE_TAG}"

      - name: Get credentials for the existing GKE cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy application with Helm
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install colorful-market ./helm/ecommerce-demo \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 10m \
            --set-string "services.frontend.image=${REGISTRY}/colorful-frontend:${IMAGE_TAG}" \
            --set-string "services.api-gateway.image=${REGISTRY}/api-gateway:${IMAGE_TAG}" \
            --set-string "services.product-service.image=${REGISTRY}/product-service:${IMAGE_TAG}" \
            --set-string "services.order-service.image=${REGISTRY}/order-service:${IMAGE_TAG}"

          kubectl get deployments,services,pods --namespace "$NAMESPACE"

      - name: Report deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          {
            echo "### Application deployed to GKE"
            echo ""
            echo "- Cluster: \`${CLUSTER_NAME}\` (\`${REGION}\`)"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Services are internal; use a private access method to open the storefront."
          } >> "$GITHUB_STEP_SUMMARY"
