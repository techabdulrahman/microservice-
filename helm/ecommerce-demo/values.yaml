imagePullPolicy: IfNotPresent

services:
  frontend:
    image: colorful-market/frontend:dev
    runAsUser: 101
    runAsGroup: 101
    port: 8080
    healthPath: /healthz
    readinessPath: /healthz
    env:
      - name: API_GATEWAY_URL
        value: 'http://{{ include "ecommerce-demo.fullname" . }}-api-gateway:8000'
    volumes:
      - name: tmp
        mountPath: /tmp
      - name: nginx-conf
        mountPath: /etc/nginx/conf.d
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-run
        mountPath: /var/run
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  api-gateway:
    image: colorful-market/api-gateway:dev
    runAsUser: 10001
    runAsGroup: 10001
    port: 8000
    healthPath: /healthz
    readinessPath: /readyz
    env:
      - name: PRODUCT_SERVICE_URL
        value: 'http://{{ include "ecommerce-demo.fullname" . }}-product-service:8000'
      - name: ORDER_SERVICE_URL
        value: 'http://{{ include "ecommerce-demo.fullname" . }}-order-service:8000'
    volumes:
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  product-service:
    image: colorful-market/product-service:dev
    runAsUser: 10001
    runAsGroup: 10001
    port: 8000
    healthPath: /healthz
    readinessPath: /readyz
    env: []
    volumes:
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  order-service:
    image: colorful-market/order-service:dev
    runAsUser: 10001
    runAsGroup: 10001
    port: 8000
    healthPath: /healthz
    readinessPath: /readyz
    env:
      - name: PRODUCT_SERVICE_URL
        value: 'http://{{ include "ecommerce-demo.fullname" . }}-product-service:8000'
    volumes:
      - name: tmp
        mountPath: /tmp
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
